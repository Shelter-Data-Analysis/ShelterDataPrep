[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shelterprep"
dynamic = ["version"]
description = "Config-driven preparation of animal shelter data files, with a statistics table recording every row removed or changed."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Michael Mavrovouniotis" }]
keywords = ["animal shelter", "length of stay", "data preparation",
            "reproducible research"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Floors, not pins.  pandas 2 is required outright: this package exists partly
# because pandas 2 rejects the datetime handling the previous pipeline relied
# on, and the date rules here assume its behaviour.  The exact versions a given
# result was produced under are recorded in that run's log, which is the record
# that matters for reproducing it.
dependencies = [
    "pandas>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
test = ["pytest>=7.0"]

[project.scripts]
shelterprep = "shelterprep.__main__:main"

[tool.setuptools]
packages = ["shelterprep"]

[tool.setuptools.dynamic]
version = { attr = "shelterprep.version.__version__" }
