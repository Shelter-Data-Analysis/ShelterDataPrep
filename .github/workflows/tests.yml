name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Every Python the package claims in requires-python.  pandas resolves to 2
  # on 3.9 and 3.10 and to 3 on 3.11 and newer, so the matrix covers both
  # major versions without asking for either by name.
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip list
      - run: python -m pytest tests/ -q

  # The jobs above run from a clone against requirements.txt, so nothing there
  # exercises the install the README documents: the console script on the
  # PATH, and the `excel` extra that a workbook source needs.  Two throwaway
  # virtualenvs, because the claim that a plain install leaves openpyxl out
  # cannot be checked in an environment that already has it.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: A plain install leaves openpyxl out
        run: |
          python -m venv /tmp/plain
          /tmp/plain/bin/python -m pip install --upgrade pip
          /tmp/plain/bin/python -m pip install .
          if /tmp/plain/bin/python -c "import openpyxl" 2>/dev/null; then
            echo "::error title=install::a plain install pulled in openpyxl"
            exit 1
          fi
      - name: The excel extra adds it
        run: |
          python -m venv /tmp/excel
          /tmp/excel/bin/python -m pip install --upgrade pip
          /tmp/excel/bin/python -m pip install ".[excel]"
          /tmp/excel/bin/python -c "import openpyxl"
      # From outside the clone, so the import resolves to the installed
      # package rather than to the source tree sitting in the working
      # directory.  The example config's paths are relative to the settings
      # file, so it still finds its fixture and still writes to results/.
      - name: The console script prepares the example
        run: |
          cd /tmp
          /tmp/excel/bin/shelterprep --help
          /tmp/excel/bin/shelterprep "$GITHUB_WORKSPACE/configs/example_tiny.yaml" -q
          test -s "$GITHUB_WORKSPACE/results/EX_data.csv"

  # A passing suite is not the same claim as an unchanged result.  One config
  # runs under each pandas and the three data files are compared byte for
  # byte; the run log is left out, since it records versions and a timestamp
  # and so differs by design.  The verdict goes to an annotation, which is
  # readable on a public repository without admin rights, unlike job logs and
  # run summaries.
  output-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Prepare under pandas 2
        run: |
          python -m pip install "pandas<3"
          python -c "import pandas; print('pandas', pandas.__version__)"
          python -m shelterprep configs/example_tiny.yaml -q
          mkdir -p /tmp/pandas2
          cp results/EX_data.csv results/EX_data_stats.csv \
             results/EX_data_summary.csv /tmp/pandas2/
      - name: Prepare under pandas 3
        run: |
          python -m pip install "pandas>=3"
          python -c "import pandas; print('pandas', pandas.__version__)"
          python -m shelterprep configs/example_tiny.yaml -q
          mkdir -p /tmp/pandas3
          cp results/EX_data.csv results/EX_data_stats.csv \
             results/EX_data_summary.csv /tmp/pandas3/
      - name: Compare
        run: |
          if diff -ru /tmp/pandas2 /tmp/pandas3 > /tmp/diff.txt; then
            echo "::notice title=pandas 2 and 3::identical output on configs/example_tiny.yaml"
          else
            echo "::error title=pandas 2 and 3::output differs on configs/example_tiny.yaml"
            head -60 /tmp/diff.txt
            exit 1
          fi
