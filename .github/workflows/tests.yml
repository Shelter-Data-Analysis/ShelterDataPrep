name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Every Python the package claims in requires-python.  pandas resolves to 2
  # on 3.9 and 3.10 and to 3 on 3.11 and newer, so the matrix covers both
  # major versions without asking for either by name.
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip list
      - run: python -m pytest tests/ -q

  # A passing suite is not the same claim as an unchanged result.  One config
  # runs under each pandas and the three data files are compared byte for
  # byte; the run log is left out, since it records versions and a timestamp
  # and so differs by design.  The verdict goes to an annotation, which is
  # readable on a public repository without admin rights, unlike job logs and
  # run summaries.
  output-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Prepare under pandas 2
        run: |
          python -m pip install "pandas<3"
          python -c "import pandas; print('pandas', pandas.__version__)"
          python -m shelterprep configs/example_tiny.yaml -q
          mkdir -p /tmp/pandas2
          cp results/EX_data.csv results/EX_data_stats.csv \
             results/EX_data_summary.csv /tmp/pandas2/
      - name: Prepare under pandas 3
        run: |
          python -m pip install "pandas>=3"
          python -c "import pandas; print('pandas', pandas.__version__)"
          python -m shelterprep configs/example_tiny.yaml -q
          mkdir -p /tmp/pandas3
          cp results/EX_data.csv results/EX_data_stats.csv \
             results/EX_data_summary.csv /tmp/pandas3/
      - name: Compare
        run: |
          if diff -ru /tmp/pandas2 /tmp/pandas3 > /tmp/diff.txt; then
            echo "::notice title=pandas 2 and 3::identical output on configs/example_tiny.yaml"
          else
            echo "::error title=pandas 2 and 3::output differs on configs/example_tiny.yaml"
            head -60 /tmp/diff.txt
            exit 1
          fi
