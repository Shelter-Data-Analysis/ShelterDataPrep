# Irvine Animal Care Center, dogs -> mLOS input
#
# Best-approximation port of stale/irvine.py. Not yet validated against
# published results; treat the maps as a starting point, and read the
# statistics table before trusting a run.

# Gzipped working copy, kept outside any git repo (see orange_county.yaml);
# original left in OneDrive/Journal Physics LOS/PRA/Irvine/IrvineDogs.csv
source_dir:   "../../_shelter_raw"
source_file:  "IR_raw.csv.gz"
date_format:  ISO8601
keep_time:    false

# From sampleStart/sampleEnd in stale/irvine.py. The extract itself runs to
# 2024-10-15. Widen both to take in the whole file; the window step counts
# whatever it costs.
window_start_date: 2014-07-01
window_end_date:   2024-10-14

dest_dir:   "../results"
dest_file:  "IR_data.csv"

# This extract has no date of birth and no size, so there is no animal_group
# for mLOS to stratify on. Leave animal_group_columns out of IR_settings.txt.
output_columns: [animal_id, intake_date, outcome_date, outcome_type, intake_type]

columns: {}          # the file already uses the canonical names
unique_report: [animal_id]

steps:
  - cut: {window_presence: [BEFORE, AFTER, _UNKNOWN_]}

  # --- not shelter stays --------------------------------------------------
  # stale/irvine.py also listed "POLICE HOLD", but the data spells it
  # POLICEHOLD, so that filter never fired and those 381 rows were kept and
  # classified as other. Kept here to match the behaviour you actually saw.
  # Add POLICEHOLD to this list to apply the cut that was intended.
  - cut: {intake_type: [DEAD, DISPO REQ, EUTH REQ, SAFEKEEP]}
  - cut: {intake_cond: DEAD}

  # DISPOSAL (448), DEAD (147) and EUTH OR (31) were in none of the old
  # code's tables, so .map turned them into NaN and they were dropped
  # uncounted. Same outcome here, but counted.
  - cut: {outcome_type: [DISPOSAL, DEAD, EUTH OR]}

  # --- outcome_type -> the canonical mLOS codes ---------------------------
  # RTO-FIELD was coded as return-to-owner in stale/irvine.py; mLOS defines
  # return-to-field as other-live, so it goes to Transf here.
  - map:
      outcome_type:
        ADOPTION:  LiveC
        ADOPT-RES: LiveC
        RTO:       LiveC
        RTO-FIELD: Transf
        TRANSFER:  Transf
        FOSTER:    Transf
        EUTH:      NonL
        EUTH VET:  NonL
        DIED:      NonL
        MISSING:   NonL
        _UNKNOWN_: InCare

  - map:
      intake_type:
        STRAY:      STRAY
        OWNER SUR:  OWNER
        FOSTER:     OTHER
        IACC-BIRTH: OTHER
        POLICEHOLD: OTHER
        RETURN:     OTHER
        TRANSFER:   OTHER

  - cut: {night_sign: "-1"}     # outcome before intake

  - dedup:
    where: {night_sign: "1"}
