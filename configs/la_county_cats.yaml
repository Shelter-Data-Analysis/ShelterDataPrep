# LA County Animal Care & Control, cats -> mLOS input
#
# Best-approximation port of stale/ladogcat.py. Same source file and the same
# maps as la_county_dogs.yaml; only the species cut and the window differ.
# Not yet validated against published results.

source_dir:   "../../_shelter_raw"
source_file:  "LA_raw.csv.gz"

# See la_county_dogs.yaml: this export writes "2021/09/14 07:00:00+00".
date_format:  mixed
keep_time:    false

# From sampleStart/sampleEnd in stale/ladogcat.py, which starts earlier than
# the dogs module did.
window_start_date: 2018-11-30
window_end_date:   2024-07-31

dest_dir:   "../results"
dest_file:  "LAdc_data.csv"

output_columns: [animal_id, intake_date, outcome_date, outcome_type, intake_type]

columns:
  animal_id:    ANIMAL_ID
  intake_date:  INTAKE_DATE
  outcome_date: OUTCOME_DATE
  intake_type:  INTAKE_TYPE_GROUP
  outcome_type: OUTCOME_TYPE_GROUP

unique_report: [animal_id]

steps:
  - cut: {ANIMAL_GROUP: [DOGS, OTHER]}
  - cut: {window_presence: [BEFORE, AFTER, _UNKNOWN_]}

  - cut: {intake_type: DECEASED}

  # The UNK9999999 placeholder rule; see la_county_dogs.yaml. Reports 0 on
  # this extract, because those rows already have a blank outcome group.
  # Kept as a tripwire against a later extract that populates it.
  - map:
      outcome_type:
        ADOPTION:     _UNKNOWN_
        RTO:          _UNKNOWN_
        RESCUE:       _UNKNOWN_
        "OTHER LIVE": _UNKNOWN_
        EUTHANASIA:   _UNKNOWN_
        DIED:         _UNKNOWN_
        ESCAPED:      _UNKNOWN_
        MISSING:      _UNKNOWN_
    where: {OUTCOME_TYPE: UNK9999999}

  - map:
      outcome_type:
        ADOPTION:     LiveC
        RTO:          LiveC
        RESCUE:       Transf
        "OTHER LIVE": Transf
        EUTHANASIA:   NonL
        DIED:         NonL
        ESCAPED:      NonL
        MISSING:      NonL
        _UNKNOWN_:    InCare

  - map:
      intake_type:
        STRAY:       STRAY
        "OWNER SUR": OWNER
        OTHER:       OTHER
        _UNKNOWN_:   OTHER

  # stale/ladogcat.py had no intake<=outcome check, unlike the dogs module.
  # Added for consistency; if it removes anything, that is worth knowing.
  - cut: {night_sign: "-1"}

  - dedup:
    where: {night_sign: "1"}
