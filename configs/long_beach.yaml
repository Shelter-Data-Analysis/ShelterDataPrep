# Long Beach Animal Care Services, dogs -> mLOS input
#
# Shelter database: Chameleon
#
# Best-approximation port of stale/longbeach.py. Not yet validated against
# published results.
#
# Noted in the stale module: the shelter ended its relationship with SPCA-LA
# during the covered period, which shows up in the transfer stream.

# Gzipped working copy, kept outside any git repo (see orange_county2.yaml);
# deposited as LB_raw.csv.gz in 10.5281/zenodo.22051091; original left in
# OneDrive/Journal Physics LOS/PRA/Long Beach October 2024/
#   animal-shelter-intakes-and-outcomes.csv
source_dir:   "../../_shelter_raw"
source_file:  "LB_raw.csv.gz"
date_format:  ISO8601
keep_time:    false

# From sampleStart/sampleEnd in stale/longbeach.py. Note the file on disk now
# runs past that end date, so this window does real work -- check the count on
# the window_presence step and widen if you want the newer rows.
window_start_date: 2018-03-01
window_end_date:   2024-12-31

dest_dir:   "../results"
dest_file:  "LB_data.csv"

# No size column in this export, but there is a date of birth, so age_group
# is the natural stratifier. Set animal_group_columns: [age_group] in
# LB_settings.txt.
output_columns: [animal_id, intake_date, outcome_date, outcome_type, intake_type,
                 age_group]

columns:
  animal_id:    "Animal ID"
  intake_date:  "Intake Date"
  outcome_date: "Outcome Date"
  intake_type:  "Intake Type"
  outcome_type: "Outcome Type"
  dob:          "DOB"

age_groups: {JUVENILE: 1, YOUNG: 4, ADULT: 9, SENIOR: 18}
unique_report: [animal_id]

steps:
  - cut: {window_presence: [BEFORE, AFTER, _UNKNOWN_]}

  # Both of these are 0 on the October 2024 extract: it is already dogs only
  # and already alive-on-intake only. Kept so that a later extract carrying
  # either would be caught rather than quietly analyzed.
  - cut: {"Animal Type": [CAT, BIRD, OTHER, RABBIT, LIVESTOCK]}
  - cut: {intake_is_dead: "Dead on Intake"}

  # "Euthenasia Required" is misspelled in the data. stale/longbeach.py:130
  # cut the correctly spelled "Euthanasia Required", which never matched, so
  # those rows survived. Spelled as the data spells it here, so the cut works.
  - cut: {intake_type: [QUARANTINE, SAFE KEEP, WILDLIFE, "Euthenasia Required",
                        "TRAP, NEUTER, RETURN"]}

  - cut: {outcome_type: ["COMMUNITY CAT", DUPLICATE, "RETURN TO WILD HABITAT",
                         "SHELTER, NEUTER, RETURN", "TRAP, NEUTER, RELEASE"]}

  # --- outcome_type -> the canonical mLOS codes ---------------------------
  # RETURN TO RESCUE was coded as return-to-owner in stale/longbeach.py.
  # Returning an animal to the rescue organization that placed it is other-live
  # rather than community-live, so it goes to Transf. Only 8 rows either way.
  - map:
      outcome_type:
        ADOPTION:          LiveC
        "FOSTER TO ADOPT": LiveC
        HOMEFIRST:         LiveC
        "RETURN TO OWNER": LiveC
        "RETURN TO RESCUE": Transf
        RESCUE:            Transf
        TRANSFER:          Transf
        TRANSPORT:         Transf
        FOSTER:            Transf
        EUTHANASIA:        NonL
        DIED:              NonL
        DISPOSAL:          NonL
        MISSING:           NonL
        _UNKNOWN_:         InCare

  # A real outcome code with no outcome date: the date failed to parse, or was
  # never recorded. Either way the row is not still in care, so it is marked
  # rather than left to read as one. mLOS discards _NODATE_ rows.
  - map: {outcome_type: {LiveC: _NODATE_, Transf: _NODATE_, NonL: _NODATE_}}
    where: {night_sign: _UNKNOWN_}

  - map:
      intake_type:
        STRAY:                   STRAY
        "OWNER SURRENDER":       OWNER
        "Adopted Animal Return": OWNER
        CONFISCATE:              OTHER
        "WELFARE SEIZED":        OTHER
        RETURN:                  OTHER
        FOSTER:                  OTHER

  # --- age_group ----------------------------------------------------------
  # age_group is an output column, so its sentinels ship to mLOS and have to
  # mean something there. _UNKNOWN_ (no date of birth) already does. Fold
  # _NEGATIVE_ into it: a date of birth falling after the intake date means
  # the record is wrong, not that the animal is young, so the age is unknown.
  # 12 rows. This export carries no size column, so nothing can stand in for
  # the age here the way a PUPPY size does in orange_county2.yaml.
  - map: {age_group: {_NEGATIVE_: _UNKNOWN_}}

  - cut: {night_sign: "-1"}
  - cut: {age_group: _OVER_}

  - dedup:
    where: {night_sign: "1"}
